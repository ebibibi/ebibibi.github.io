<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胡田昌彦 | 自己紹介</title>
  <style>
    :root {
      --accent: #4f6df5;
      --accent-dark: #3a52c9;
      --text: #1f2330;
      --muted: #6b7280;
      --bg: #f7f8fc;
      --card: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.8;
    }
    .hero {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      text-align: center;
      padding: 96px 24px 80px;
    }
    .avatar {
      width: 128px; height: 128px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; font-weight: 700;
      margin: 0 auto 24px;
      border: 3px solid rgba(255,255,255,0.5);
    }
    .hero h1 { font-size: 2.4rem; margin-bottom: 8px; }
    .hero p { font-size: 1.1rem; opacity: 0.92; }
    .container { max-width: 760px; margin: 0 auto; padding: 0 24px; }
    section { padding: 56px 0; }
    section h2 {
      font-size: 1.4rem; margin-bottom: 24px;
      display: inline-block; border-bottom: 3px solid var(--accent); padding-bottom: 6px;
    }
    .card {
      background: var(--card); border-radius: 14px; padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag {
      background: #eef1ff; color: var(--accent-dark);
      padding: 6px 14px; border-radius: 999px; font-size: 0.9rem; font-weight: 600;
    }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .links a {
      display: inline-block; text-decoration: none;
      background: var(--accent); color: #fff;
      padding: 10px 20px; border-radius: 10px; font-weight: 600;
      transition: background 0.2s;
    }
    .links a:hover { background: var(--accent-dark); }
    footer { text-align: center; color: var(--muted); padding: 40px 24px; font-size: 0.85rem; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>

  <header class="hero">
    <div class="avatar">胡</div>
    <h1>胡田昌彦</h1>
    <p>YouTube Live で Claude Code でつくりました</p>
  </header>

  <main class="container">

    <section>
      <h2>自己紹介</h2>
      <div class="card">
        <p>
          人間です。<br>
          このページは YouTube Live の配信中に、Claude Code と一緒に
          一から作ってそのまま公開しました。記念に残しておきます。
        </p>
      </div>
    </section>

    <section>
      <h2>できること・興味</h2>
      <div class="card">
        <div class="tags">
          <span class="tag">特になし（本人談）</span>
          <span class="tag">配信</span>
          <span class="tag">Claude Code</span>
          <span class="tag">とりあえずやってみる</span>
        </div>
      </div>
    </section>

    <section>
      <h2>これまでの活動</h2>
      <div class="card">
        <p><strong>2026年</strong> ｜ YouTube Live の配信中に、このサイトを Claude Code で作成・公開。</p>
      </div>
    </section>

    <section>
      <h2>連絡先・リンク</h2>
      <div class="card">
        <div class="links">
          <!-- ↓ YouTube はご自分のチャンネルURLに差し替えてください -->
          <a href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>
          <a href="https://github.com/ebibibi" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </section>

  </main>

  <footer>
    &copy; 2026 胡田昌彦
  </footer>

</body>
</html>
